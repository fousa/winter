<button type="button" style="height: 44px; padding: 0 18px; border-radius: 999px; display: flex; align-items: center; gap: 10px; font-family: inherit; font-size: 17px; font-weight: 600; color: #FFFFFF; cursor: pointer; background: #D9322A; border: 1px solid #D9322A; box-shadow: inset 0 1px 1px rgba(255,255,255,0.35), 0 6px 16px rgba(217,50,42,0.28)">

<button type="button" style="height: 44px; padding: 0 18px; border-radius: 999px; display: flex; align-items: center; gap: 10px; font-family: inherit; font-size: 17px; font-weight: 600; color: #000000; cursor: pointer; background: #FFFFFF; border: 1px solid rgba(60,60,67,0.16); box-shadow: 0 2px 8px rgba(0,0,0,0.08)">

<span>Pause</span>
</button>

<div style="margin-top: 8px; font-size: 15px; color: #3A3A3C">Going for lunch? Pause, and the break is not counted.</div>

<div style="display: flex; align-items: baseline; justify-content: space-between; margin-top: 22px">
<div style="font-size: 20px; font-weight: 700; letter-spacing: -0.3px">What did you work on?</div>
<div style="font-size: 16px; color: #3A3A3C">Optional</div>
</div>
<button type="button" style="margin-top: 10px; width: 100%; height: 68px; box-sizing: border-box; padding: 0 18px; border-radius: 24px; display: flex; align-items: center; gap: 16px; font-family: inherit; text-align: left; color: #000000; cursor: pointer; background: rgba(255,255,255,0.85); border: 1px solid rgba(255,255,255,0.95); box-shadow: inset 0 1px 1px rgba(255,255,255,0.95), 0 2px 8px rgba(0,0,0,0.06)">
<svg width="26" height="26" viewBox="0 0 24 24" fill="#0A6CDB" aria-hidden="true"><g transform="rotate(90 12 12)"><path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"></path></g></svg>
<span style="flex-grow: 1; display: flex; flex-direction: column">
<span style="font-size: 17px; font-weight: 600">OO-ZXA</span>
<span style="font-size: 15px; color: #3A3A3C">Schleicher ASK 21</span>
</span>
<svg width="10" height="16" viewBox="0 0 10 16" fill="none" stroke="#6C6C70" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 2l6 6-6 6"></path></svg>
</button>

<textarea aria-label="Comment" placeholder="What did you do? For the board in zweef.app" style="margin-top: 10px; width: 100%; height: 72px; box-sizing: border-box; padding: 14px 16px; border: none; outline: none; resize: none; border-radius: 20px; background: #FFFFFF; font-family: inherit; font-size: 17px; color: #000000"></textarea>
<div style="margin-top: 10px; font-size: 13px; color: #3A3A3C">Optional.</div>
<div style="margin-top: 6px; font-size: 13px; color: #3A3A3C">Saved on this device, with or without internet.</div>
</div>
</div>
