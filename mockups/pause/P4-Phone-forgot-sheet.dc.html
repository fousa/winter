<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>iPhone timer sheet after a forgotten break</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: #B9B9BE; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', system-ui, sans-serif; color: #000000; -webkit-font-smoothing: antialiased">
<div role="dialog" aria-label="Timer" style="position: absolute; left: 0; right: 0; top: 56px; bottom: 0; box-sizing: border-box; padding: 12px 16px 24px; border-radius: 38px 38px 0 0; background: #F2F2F7; display: flex; flex-direction: column; box-shadow: 0 -8px 40px rgba(0,0,0,0.18)">

<div style="height: 48px; display: flex; align-items: center; justify-content: space-between">
<button type="button" style="height: 44px; padding: 0 18px; border-radius: 999px; font-family: inherit; font-size: 17px; color: #000000; cursor: pointer; background: #FFFFFF; border: 1px solid rgba(60,60,67,0.12); box-shadow: 0 2px 8px rgba(0,0,0,0.06)">Close</button>
<div style="font-size: 17px; font-weight: 600">Timer</div>
<button type="button" style="height: 44px; padding: 0 18px; border-radius: 999px; font-family: inherit; font-size: 17px; color: #000000; cursor: pointer; background: #FFFFFF; border: 1px solid rgba(60,60,67,0.12); box-shadow: 0 2px 8px rgba(0,0,0,0.06)">Delete</button>
</div>

<div style="display: flex; align-items: center; gap: 14px; margin-top: 14px">
<div aria-hidden="true" style="width: 64px; height: 64px; flex-shrink: 0; border-radius: 999px; background: #4B45C6; color: #FFFFFF; font-size: 25px; font-weight: 600; display: flex; align-items: center; justify-content: center">JV</div>
<div style="display: flex; flex-direction: column; gap: 2px">
<div style="font-size: 22px; font-weight: 700; letter-spacing: -0.4px">Jan Verhoeven</div>
<div style="font-size: 16px; font-weight: 600; color: #8A4500">On a break since 12:30</div>
</div>
</div>

<div style="display: flex; align-items: center; gap: 10px; margin-top: 10px">
<sc-if value="{{still}}" hint-placeholder-val="{{ true }}">
<svg width="34" height="34" viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="13" fill="#FCEBD9"></circle><rect x="8.5" y="7.5" width="3.5" height="11" rx="1" fill="#8A4500"></rect><rect x="14" y="7.5" width="3.5" height="11" rx="1" fill="#8A4500"></rect></svg>
</sc-if>
<div style="font-size: 44px; font-weight: 600; letter-spacing: -1.2px; line-height: 1.15; font-variant-numeric: tabular-nums; color: {{timeColor}}">{{time}}</div>
<div style="margin-left: 2px; font-size: 16px; color: #3A3A3C">{{timeCaption}}</div>
</div>

<div style="margin-top: 14px; box-sizing: border-box; padding: 14px; border-radius: 24px; background: #FDF1E3; border: 1px solid #E8B27A; display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 20px; font-weight: 700; letter-spacing: -0.3px">Forgot to resume?</div>
<div style="font-size: 16px; color: #3A3A3C">This break has lasted 3h35m. How long was it really?</div>
<div role="group" aria-label="Length of the break" style="margin-top: 2px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{chips}}" as="c" hint-placeholder-count="4">
<button type="button" onClick="{{c.pick}}" aria-pressed="{{c.pressed}}" style="height: 44px; padding: 0; border-radius: 999px; font-family: inherit; font-size: 17px; font-weight: 600; cursor: pointer; {{c.style}}">{{c.label}}</button>
</sc-for>
</div>
</div>

<div style="display: flex; align-items: center; gap: 10px; margin-top: 14px">
<button type="button" style="height: 44px; padding: 0 18px; border-radius: 999px; display: flex; align-items: center; gap: 10px; font-family: inherit; font-size: 17px; font-weight: 600; color: #FFFFFF; cursor: pointer; background: #0A6CDB; border: 1px solid #0A6CDB; box-shadow: inset 0 1px 1px rgba(255,255,255,0.35), 0 6px 16px rgba(10,108,219,0.28)">
<svg width="14" height="14" viewBox="0 0 14 14" fill="#FFFFFF" aria-hidden="true"><path d="M3 1.5v11a.6.6 0 0 0 .9.5l9-5.5a.6.6 0 0 0 0-1l-9-5.5a.6.6 0 0 0-.9.5z"></path></svg>
<span>{{resumeLabel}}</span>
</button>
<button type="button" style="height: 44px; padding: 0 18px; border-radius: 999px; display: flex; align-items: center; gap: 10px; font-family: inherit; font-size: 17px; font-weight: 600; color: #FFFFFF; cursor: pointer; background: #D9322A; border: 1px solid #D9322A; box-shadow: inset 0 1px 1px rgba(255,255,255,0.35), 0 6px 16px rgba(217,50,42,0.28)">
<svg width="14" height="14" viewBox="0 0 14 14" fill="#FFFFFF" aria-hidden="true"><rect x="1" y="1" width="12" height="12" rx="2.5"></rect></svg>
<span>Stop and save</span>
</button>
</div>
<div style="margin-top: 8px; min-height: 38px; font-size: 15px; color: #3A3A3C">{{hint}}</div>

<div style="display: flex; align-items: baseline; justify-content: space-between; margin-top: 14px">
<div style="font-size: 20px; font-weight: 700; letter-spacing: -0.3px">What did you work on?</div>
<div style="font-size: 16px; color: #3A3A3C">Optional</div>
</div>
<button type="button" style="margin-top: 10px; width: 100%; height: 64px; flex-shrink: 0; box-sizing: border-box; padding: 0 16px; border-radius: 24px; display: flex; align-items: center; gap: 14px; font-family: inherit; text-align: left; color: #000000; cursor: pointer; background: #FFFFFF; border: 1px solid rgba(60,60,67,0.12); box-shadow: 0 2px 8px rgba(0,0,0,0.05)">
<svg width="26" height="26" viewBox="0 0 24 24" fill="#0A6CDB" aria-hidden="true"><g transform="rotate(90 12 12)"><path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"></path></g></svg>
<span style="flex-grow: 1; display: flex; flex-direction: column">
<span style="font-size: 17px; font-weight: 600">OO-ZXA</span>
<span style="font-size: 15px; color: #3A3A3C">Schleicher ASK 21</span>
</span>
<svg width="10" height="16" viewBox="0 0 10 16" fill="none" stroke="#6C6C70" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 2l6 6-6 6"></path></svg>
</button>

<textarea aria-label="Comment" placeholder="What did you do? For the board in zweef.app" style="margin-top: 10px; width: 100%; height: 56px; flex-shrink: 0; box-sizing: border-box; padding: 14px 16px; border: none; outline: none; resize: none; border-radius: 20px; background: #FFFFFF; font-family: inherit; font-size: 17px; color: #000000"></textarea>
<div style="margin-top: 10px; font-size: 13px; color: #3A3A3C">Saved on this device, with or without internet.</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { brk: 0 };
  }
  renderVals() {
    var self = this;
    var total = 413;
    var beforeBreak = 198;
    var brk = this.state.brk;
    var fmt = function (m) {
      var h = Math.floor(m / 60);
      var r = m % 60;
      return h > 0 ? h + 'h' + (r < 10 ? '0' : '') + r + 'm' : r + 'm';
    };
    var opts = [[30, '30 min', ''], [45, '45 min', ''], [60, '1 hour', ''], [0, 'Still on a break', 'grid-column: span 3; ']];
    var picked = '';
    var chips = opts.map(function (o) {
      var on = brk === o[0];
      if (on) { picked = o[1]; }
      return {
        label: o[1],
        pressed: on ? 'true' : 'false',
        style: o[2] + (on
          ? 'color: #FFFFFF; background: #0A6CDB; border: 1px solid #0A6CDB; box-shadow: inset 0 1px 1px rgba(255,255,255,0.35), 0 4px 12px rgba(10,108,219,0.28);'
          : 'color: #000000; background: #FFFFFF; border: 1px solid rgba(60,60,67,0.16); box-shadow: 0 2px 8px rgba(0,0,0,0.06);'),
        pick: function () { self.setState({ brk: o[0] }); }
      };
    });
    var still = brk === 0;
    return {
      chips: chips,
      still: still,
      time: still ? fmt(beforeBreak) : fmt(total - brk),
      timeColor: still ? '#6C6C70' : '#000000',
      timeCaption: still ? 'worked before the break' : 'worked, break taken off',
      resumeLabel: still ? 'Resume' : 'Keep working',
      hint: still
        ? 'Stopping now saves 09:12–12:30.'
        : 'Stopping now saves 09:12–16:05 with a ' + picked + ' break.'
    };
  }
}
</script>
</body>
</html>
