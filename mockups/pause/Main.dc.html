<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Home</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1194px; height: 834px; position: relative; overflow: hidden; box-sizing: border-box; background: #F2F2F7; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', system-ui, sans-serif; color: #000000; -webkit-font-smoothing: antialiased">

<div style="position: absolute; right: 24px; top: 20px; display: flex; align-items: center; gap: 12px">
<button type="button" aria-label="Hours, 4 sessions waiting to upload" style="position: relative; height: 44px; padding: 0 16px; border-radius: 999px; display: flex; align-items: center; gap: 8px; font-family: inherit; font-size: 17px; font-weight: 600; color: #000000; cursor: pointer; background: rgba(255,255,255,0.78); border: 1px solid rgba(255,255,255,0.95); box-shadow: inset 0 1px 1px rgba(255,255,255,0.95), 0 1px 2px rgba(0,0,0,0.05), 0 6px 18px rgba(0,0,0,0.07)">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 18a5 5 0 0 1-.6-9.96A6.5 6.5 0 0 1 19 9a4.5 4.5 0 0 1-1 8.9"></path><path d="M12 20v-8"></path><path d="M9 14.5l3-3 3 3"></path></svg>
<span>Hours</span>
<span aria-hidden="true" style="position: absolute; right: -4px; top: -6px; min-width: 20px; height: 20px; box-sizing: border-box; padding: 0 5px; border-radius: 999px; background: #D9322A; color: #FFFFFF; font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center">4</span>
</button>
<label style="width: 240px; height: 44px; box-sizing: border-box; padding: 0 16px; border-radius: 999px; display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.78); border: 1px solid rgba(255,255,255,0.95); box-shadow: inset 0 1px 1px rgba(255,255,255,0.95), 0 1px 2px rgba(0,0,0,0.05), 0 6px 18px rgba(0,0,0,0.07)">
<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#3A3A3C" stroke-width="2.25" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search members</span>
<input type="search" placeholder="Search members" style="border: none; outline: none; flex-grow: 1; min-width: 0; background: transparent; font-family: inherit; font-size: 17px; color: #000000">
</label>
</div>

<div style="position: absolute; left: 32px; right: 76px; top: 76px; display: flex; flex-direction: column; gap: 12px">

<div style="display: flex; align-items: center; gap: 20px">
<div aria-hidden="true" style="width: 88px; height: 88px; flex-shrink: 0; border-radius: 999px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 14px rgba(0,0,0,0.12)">
<div style="width: 74px; height: 74px; border-radius: 999px; background: #0A84FF; display: flex; align-items: center; justify-content: center">
<svg width="42" height="42" viewBox="0 0 24 24" fill="#FFFFFF"><g transform="rotate(90 12 12)"><path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"></path></g></svg>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
<h1 style="margin: 0; font-size: 44px; font-weight: 800; letter-spacing: -1px; line-height: 1.1">Zweefvliegclub Voorbeeld</h1>
<div style="font-size: 20px; color: #3A3A3C">Maintenance hours · Saturday, 21 November · tap your name to start</div>
</div>
</div>

<div style="display: flex; align-items: center; gap: 14px; min-height: 44px; margin-top: 4px">
<h2 style="margin: 0; font-size: 20px; font-weight: 600; color: #3A3A3C">Working now</h2>
<sc-if value="{{groupButtons}}" hint-placeholder-val="{{ false }}">
<button type="button" style="height: 44px; padding: 0 16px; border-radius: 999px; display: flex; align-items: center; gap: 8px; font-family: inherit; font-size: 17px; font-weight: 600; color: #000000; cursor: pointer; background: rgba(255,255,255,0.78); border: 1px solid rgba(255,255,255,0.95); box-shadow: inset 0 1px 1px rgba(255,255,255,0.95), 0 1px 2px rgba(0,0,0,0.05), 0 6px 18px rgba(0,0,0,0.07)">
<svg width="14" height="14" viewBox="0 0 14 14" fill="#000000" aria-hidden="true"><rect x="2" y="1" width="3.5" height="12" rx="1"></rect><rect x="8.5" y="1" width="3.5" height="12" rx="1"></rect></svg>
<span>Pause everyone</span>
</button>
</sc-if>
</div>

<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
<sc-for list="{{working}}" as="t" hint-placeholder-count="3">
<div style="position: relative; box-sizing: border-box; border-radius: 24px; background: {{t.tileBg}}; border: 1px solid {{t.tileBorder}}; box-shadow: inset 0 1px 1px rgba(255,255,255,0.95), 0 1px 2px rgba(0,0,0,0.05), 0 6px 18px rgba(0,0,0,0.07)">
<button type="button" aria-label="{{t.aria}}" style="width: 100%; height: 100%; box-sizing: border-box; padding: 16px; border: none; border-radius: 24px; background: transparent; font-family: inherit; text-align: left; color: #000000; cursor: pointer; display: flex; flex-direction: column; gap: 8px">
<span style="display: flex; align-items: center; gap: 12px">
<span aria-hidden="true" style="width: 52px; height: 52px; flex-shrink: 0; border-radius: 999px; color: #FFFFFF; font-size: 20px; font-weight: 600; display: flex; align-items: center; justify-content: center; background: {{t.bg}}">{{t.initials}}</span>
<span style="display: flex; flex-direction: column; min-width: 0">
<span style="font-size: 17px; font-weight: 600; letter-spacing: -0.2px">{{t.first}}</span>
<span style="font-size: 17px; color: #3A3A3C">{{t.last}}</span>
</span>
</span>
<span style="display: flex; align-items: center; gap: 8px; min-height: 44px">
<sc-if value="{{t.paused}}" hint-placeholder-val="{{ false }}">
<svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="13" fill="#FCEBD9"></circle><rect x="8.5" y="7.5" width="3.5" height="11" rx="1" fill="#8A4500"></rect><rect x="14" y="7.5" width="3.5" height="11" rx="1" fill="#8A4500"></rect></svg>
</sc-if>
<span style="font-size: 28px; font-weight: 600; letter-spacing: -0.5px; font-variant-numeric: tabular-nums; color: {{t.timeColor}}">{{t.time}}</span>
</span>
<sc-if value="{{t.paused}}" hint-placeholder-val="{{ false }}">
<span style="font-size: 15px; font-weight: 600; color: #8A4500">{{t.caption}}</span>
</sc-if>
</button>
<sc-if value="{{t.showPause}}" hint-placeholder-val="{{ false }}">
<button type="button" aria-label="{{t.pauseAria}}" style="position: absolute; right: 14px; top: 76px; height: 44px; padding: 0 16px; border-radius: 999px; display: flex; align-items: center; gap: 8px; font-family: inherit; font-size: 17px; font-weight: 600; color: #000000; cursor: pointer; background: #FFFFFF; border: 1px solid rgba(60,60,67,0.16); box-shadow: 0 2px 8px rgba(0,0,0,0.08)">
<svg width="14" height="14" viewBox="0 0 14 14" fill="#000000" aria-hidden="true"><rect x="2" y="1" width="3.5" height="12" rx="1"></rect><rect x="8.5" y="1" width="3.5" height="12" rx="1"></rect></svg>
<span>Pause</span>
</button>
</sc-if>
<sc-if value="{{t.showResume}}" hint-placeholder-val="{{ false }}">
<button type="button" aria-label="{{t.resumeAria}}" style="position: absolute; right: 14px; top: 76px; height: 44px; padding: 0 16px; border-radius: 999px; display: flex; align-items: center; gap: 8px; font-family: inherit; font-size: 17px; font-weight: 600; color: #FFFFFF; cursor: pointer; background: #0A6CDB; border: 1px solid #0A6CDB; box-shadow: inset 0 1px 1px rgba(255,255,255,0.35), 0 4px 12px rgba(10,108,219,0.28)">
<svg width="14" height="14" viewBox="0 0 14 14" fill="#FFFFFF" aria-hidden="true"><path d="M3 1.5v11a.6.6 0 0 0 .9.5l9-5.5a.6.6 0 0 0 0-1l-9-5.5a.6.6 0 0 0-.9.5z"></path></svg>
<span>Resume</span>
</button>
</sc-if>
</div>
</sc-for>
</div>

<sc-if value="{{showBreak}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center; gap: 14px; min-height: 44px; margin-top: 4px">
<h2 style="margin: 0; font-size: 20px; font-weight: 600; color: #3A3A3C">On a break</h2>
<button type="button" style="height: 44px; padding: 0 16px; border-radius: 999px; display: flex; align-items: center; gap: 8px; font-family: inherit; font-size: 17px; font-weight: 600; color: #000000; cursor: pointer; background: rgba(255,255,255,0.78); border: 1px solid rgba(255,255,255,0.95); box-shadow: inset 0 1px 1px rgba(255,255,255,0.95), 0 1px 2px rgba(0,0,0,0.05), 0 6px 18px rgba(0,0,0,0.07)">
<svg width="14" height="14" viewBox="0 0 14 14" fill="#000000" aria-hidden="true"><path d="M3 1.5v11a.6.6 0 0 0 .9.5l9-5.5a.6.6 0 0 0 0-1l-9-5.5a.6.6 0 0 0-.9.5z"></path></svg>
<span>Resume everyone</span>
</button>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
<sc-for list="{{onBreak}}" as="b" hint-placeholder-count="2">
<button type="button" aria-label="{{b.aria}}" style="box-sizing: border-box; padding: 16px; border-radius: 24px; font-family: inherit; text-align: left; color: #000000; cursor: pointer; display: flex; flex-direction: column; gap: 8px; background: rgba(255,255,255,0.78); border: 1px solid rgba(255,255,255,0.95); box-shadow: inset 0 1px 1px rgba(255,255,255,0.95), 0 1px 2px rgba(0,0,0,0.05), 0 6px 18px rgba(0,0,0,0.07)">
<span style="display: flex; align-items: center; gap: 12px">
<span aria-hidden="true" style="width: 52px; height: 52px; flex-shrink: 0; border-radius: 999px; color: #FFFFFF; font-size: 20px; font-weight: 600; display: flex; align-items: center; justify-content: center; background: {{b.bg}}">{{b.initials}}</span>
<span style="display: flex; flex-direction: column; min-width: 0">
<span style="font-size: 17px; font-weight: 600; letter-spacing: -0.2px">{{b.first}}</span>
<span style="font-size: 17px; color: #3A3A3C">{{b.last}}</span>
</span>
</span>
<span style="display: flex; align-items: center; gap: 8px; min-height: 44px">
<svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="13" fill="#E5E5EA"></circle><rect x="8.5" y="7.5" width="3.5" height="11" rx="1" fill="#3A3A3C"></rect><rect x="14" y="7.5" width="3.5" height="11" rx="1" fill="#3A3A3C"></rect></svg>
<span style="font-size: 28px; font-weight: 600; letter-spacing: -0.5px; font-variant-numeric: tabular-nums; color: #6C6C70">{{b.time}}</span>
<span style="margin-left: 6px; font-size: 17px; color: #3A3A3C">{{b.since}}</span>
</span>
</button>
</sc-for>
</div>
</div>
</sc-if>

<h2 style="margin: 12px 0 0; font-size: 20px; font-weight: 600; color: #3A3A3C">Recents</h2>
<div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px">
<sc-for list="{{recents}}" as="m" hint-placeholder-count="3">
<button type="button" style="height: 84px; box-sizing: border-box; padding: 0 14px; border-radius: 24px; display: flex; align-items: center; gap: 12px; font-family: inherit; text-align: left; color: #000000; cursor: pointer; background: rgba(255,255,255,0.78); border: 1px solid rgba(255,255,255,0.95); box-shadow: inset 0 1px 1px rgba(255,255,255,0.95), 0 1px 2px rgba(0,0,0,0.05), 0 6px 18px rgba(0,0,0,0.07)">
<span aria-hidden="true" style="width: 52px; height: 52px; flex-shrink: 0; border-radius: 999px; color: #FFFFFF; font-size: 20px; font-weight: 600; display: flex; align-items: center; justify-content: center; background: {{m.bg}}">{{m.initials}}</span>
<span style="display: flex; flex-direction: column; min-width: 0">
<span style="font-size: 17px; font-weight: 600; letter-spacing: -0.2px">{{m.first}}</span>
<span style="font-size: 17px; color: #3A3A3C">{{m.last}}</span>
</span>
</button>
</sc-for>
</div>

<sc-for list="{{alpha}}" as="m" hint-placeholder-count="4">
<div style="display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 12px 0 0; font-size: 20px; font-weight: 600; color: #3A3A3C">{{m.letter}}</h2>
<div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px">
<button type="button" style="height: 84px; box-sizing: border-box; padding: 0 14px; border-radius: 24px; display: flex; align-items: center; gap: 12px; font-family: inherit; text-align: left; color: #000000; cursor: pointer; background: rgba(255,255,255,0.78); border: 1px solid rgba(255,255,255,0.95); box-shadow: inset 0 1px 1px rgba(255,255,255,0.95), 0 1px 2px rgba(0,0,0,0.05), 0 6px 18px rgba(0,0,0,0.07)">
<span aria-hidden="true" style="width: 52px; height: 52px; flex-shrink: 0; border-radius: 999px; color: #FFFFFF; font-size: 20px; font-weight: 600; display: flex; align-items: center; justify-content: center; background: {{m.bg}}">{{m.initials}}</span>
<span style="display: flex; flex-direction: column; min-width: 0">
<span style="font-size: 17px; font-weight: 600; letter-spacing: -0.2px">{{m.first}}</span>
<span style="font-size: 17px; color: #3A3A3C">{{m.last}}</span>
</span>
</button>
</div>
</div>
</sc-for>
</div>

<nav aria-label="Jump to a letter" style="position: absolute; right: 12px; top: 400px; width: 44px; box-sizing: border-box; padding: 6px 0; border-radius: 22px; display: flex; flex-direction: column; align-items: center; background: rgba(255,255,255,0.78); border: 1px solid rgba(255,255,255,0.95); box-shadow: inset 0 1px 1px rgba(255,255,255,0.95), 0 1px 2px rgba(0,0,0,0.05), 0 6px 18px rgba(0,0,0,0.07)">
<sc-for list="{{alpha}}" as="m" hint-placeholder-count="4">
<button type="button" aria-label="{{m.jump}}" style="width: 44px; height: 40px; border: none; background: transparent; font-family: inherit; font-size: 17px; font-weight: 700; color: #0A6CDB; cursor: pointer">{{m.letter}}</button>
</sc-for>
</nav>

<sc-if value="{{showToast}}" hint-placeholder-val="{{ false }}">
<div role="status" style="position: absolute; left: 50%; bottom: 24px; transform: translateX(-50%); box-sizing: border-box; min-height: 64px; padding: 10px 12px 10px 14px; border-radius: 999px; display: flex; align-items: center; gap: 14px; white-space: nowrap; background: rgba(255,255,255,0.9); -webkit-backdrop-filter: blur(28px) saturate(190%); backdrop-filter: blur(28px) saturate(190%); border: 1px solid rgba(255,255,255,0.95); box-shadow: inset 0 1px 1px rgba(255,255,255,0.95), 0 12px 40px rgba(0,0,0,0.18), 0 2px 6px rgba(0,0,0,0.06)">
<svg width="40" height="40" viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="13" fill="#FCEBD9"></circle><rect x="8.5" y="7.5" width="3.5" height="11" rx="1" fill="#8A4500"></rect><rect x="14" y="7.5" width="3.5" height="11" rx="1" fill="#8A4500"></rect></svg>
<span style="font-size: 20px; font-weight: 600; letter-spacing: -0.2px">Jan is on a break since 12:30</span>
<button type="button" style="height: 44px; padding: 0 18px; border-radius: 999px; font-family: inherit; font-size: 17px; font-weight: 600; color: #000000; cursor: pointer; background: #FFFFFF; border: 1px solid rgba(60,60,67,0.16); box-shadow: 0 2px 8px rgba(0,0,0,0.08)">Undo</button>
</div>
</sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"variant":{"editor":"enum","default":"today","options":["today","paused","tileButtons","breakSection","late","forgot"]},"$preview":{"width":1194,"height":834}}'>
class Component extends DCLogic {
  renderVals() {
    var v = this.props.variant ?? 'today';
    var jan = { first: 'Jan', last: 'Verhoeven', initials: 'JV', bg: '#4B45C6' };
    var koen = { first: 'Koen', last: 'Maes', initials: 'KM', bg: '#9B2FAE' };
    var pieter = { first: 'Pieter', last: 'De Smet', initials: 'PD', bg: '#C02A4A' };
    var run = function (p, time) {
      return Object.assign({}, p, {
        time: time, timeColor: '#000000', paused: false, caption: '', since: '',
        tileBg: 'rgba(255,255,255,0.78)', tileBorder: 'rgba(255,255,255,0.95)',
        showPause: false, showResume: false,
        aria: p.first + ' ' + p.last + ', working, ' + time,
        pauseAria: 'Pause ' + p.first + "'s timer", resumeAria: ''
      });
    };
    var brk = function (p, time, since) {
      return Object.assign({}, p, {
        time: time, timeColor: '#6C6C70', paused: true,
        tileBg: 'rgba(255,255,255,0.78)', tileBorder: 'rgba(255,255,255,0.95)',
        caption: 'On a break since ' + since, since: 'since ' + since,
        showPause: false, showResume: false,
        aria: p.first + ' ' + p.last + ', on a break since ' + since + ', ' + time + ' worked',
        pauseAria: '', resumeAria: 'Resume ' + p.first + "'s timer"
      });
    };
    var working;
    var onBreak = [];
    if (v === 'paused' || v === 'tileButtons') {
      working = [brk(jan, '3h18m', '12:30'), run(koen, '2h42m'), run(pieter, '28m')];
    } else if (v === 'breakSection') {
      working = [run(pieter, '28m')];
      onBreak = [brk(jan, '3h18m', '12:30'), brk(koen, '2h30m', '12:30')];
    } else if (v === 'forgot') {
      var forgotten = brk(jan, '3h18m', '12:30');
      forgotten.caption = 'Break of 3h35m · forgot to resume?';
      forgotten.tileBg = '#FDF1E3';
      forgotten.tileBorder = '#E8B27A';
      forgotten.timeColor = '#5E5E62';
      working = [forgotten, run(koen, '6h05m'), run(pieter, '3h51m')];
    } else if (v === 'late') {
      working = [run(jan, '6h53m'), run(koen, '6h05m'), run(pieter, '3h51m')];
    } else {
      working = [run(jan, '3h18m'), run(koen, '2h30m'), run(pieter, '16m')];
    }
    if (v === 'tileButtons') {
      working.forEach(function (t) { t.showPause = !t.paused; t.showResume = t.paused; });
    }
    var bart = { first: 'Bart', last: 'Wouters', initials: 'BW', bg: '#1A7F5F', letter: 'B', jump: 'Jump to B' };
    var ellen = { first: 'Ellen', last: 'Peeters', initials: 'EP', bg: '#0F7F87', letter: 'E', jump: 'Jump to E' };
    var lotte = { first: 'Lotte', last: 'Janssens', initials: 'LJ', bg: '#B4590F', letter: 'L', jump: 'Jump to L' };
    var sofie = { first: 'Sofie', last: 'Claes', initials: 'SC', bg: '#1777A6', letter: 'S', jump: 'Jump to S' };
    return {
      working: working,
      onBreak: onBreak,
      showBreak: onBreak.length > 0,
      groupButtons: v === 'breakSection',
      showToast: v === 'tileButtons',
      recents: [bart, ellen, sofie],
      alpha: [bart, ellen, lotte, sofie]
    };
  }
}
</script>
</body>
</html>
